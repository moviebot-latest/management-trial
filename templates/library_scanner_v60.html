<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library QR Scanner</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><style>.wrap{max-width:760px;margin:26px auto;padding:0 15px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:18px}video{width:100%;max-height:440px;background:#0f172a;border-radius:12px}.btn{padding:10px 14px;border:0;border-radius:9px;background:#4f46e5;color:white;font-weight:700;cursor:pointer}</style></head><body><main class="wrap"><p><a href="{{ url_for('dashboard') }}">← Dashboard</a></p><section class="card"><h1>▦ Scan Book QR Code</h1><p id="status">Use your phone's camera. Camera access is requested only while this scanner page is open.</p><video id="video" playsinline muted></video><div style="display:flex;gap:10px;margin-top:12px"><button class="btn" id="start">Start camera</button><button class="btn" id="stop" type="button">Stop camera</button></div><p id="result"></p><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px"><label for="manualCode">Manual Book ID</label><input id="manualCode" placeholder="BK-000001" style="padding:9px;border:1px solid #cbd5e1;border-radius:8px"><button class="btn" id="openManual" type="button">Open Book</button></div><p><a href="{{ url_for('books_catalog') }}">Open catalog</a></p></section></main><script>
let stream=null, timer=null;const video=document.getElementById('video'),statusEl=document.getElementById('status'),result=document.getElementById('result');
document.getElementById('start').onclick=async()=>{try{if(!('BarcodeDetector'in window)){statusEl.textContent='This browser does not support built-in QR scanning. Use your phone camera app or open the book QR image.';return;}const detector=new BarcodeDetector({formats:['qr_code','code_128']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();statusEl.textContent='Camera active. Point it at a Library book QR code.';timer=setInterval(async()=>{try{const codes=await detector.detect(video);if(codes.length){const value=codes[0].rawValue;const u=new URL(value,location.origin);const match=/^BK-(\d{6,})$/.exec(value.trim());if(match){stop();location.href='/book/'+parseInt(match[1],10);}else if(u.origin===location.origin&&/^\/book\/\d+$/.test(u.pathname)){stop();location.href=u.href;}else{result.textContent='Code detected, but it is not a Library book code/link.';}}}catch(e){}},350);}catch(e){statusEl.textContent='Camera could not start: '+e.message;}};
function stop(){if(timer)clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;statusEl.textContent='Camera stopped.';}document.getElementById('stop').onclick=stop;document.getElementById('openManual').onclick=()=>{const raw=document.getElementById('manualCode').value.trim();const m=/^(?:BK-)?(\d{1,12})$/i.exec(raw);if(!m){statusEl.textContent='Enter a Book ID like BK-000001.';return;}location.href='/book/'+Number(m[1]);};window.addEventListener('pagehide',stop);
</script></body></html>
