{% extends 'auth_base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<p class="error-code" aria-hidden="true">{{ code }}</p>
<h1>{{ title }}</h1>
<p class="lead">{{ message }}</p>
{% if error_id %}<p><span class="error-id">Error ID {{ error_id }}</span></p>{% endif %}
<div class="btn-row"><a class="btn" style="margin-top:0" href="{{ url_for('index') }}">Go to home</a><a class="btn quiet" href="javascript:location.reload()">Try again</a></div>
{% endblock %}
