<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Error {{ code }} — Management System</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="error-shell">
  <div class="error-box">
    <div class="error-num">{{ code }}</div>
    <h1 class="error-title">
      {% if   code == 404 %}Page Not Found
      {% elif code == 403 %}Access Denied
      {% elif code == 400 %}Bad Request
      {% elif code == 413 %}File Too Large
      {% elif code == 500 %}Server Error
      {% else %}Something Went Wrong{% endif %}
    </h1>
    <p class="error-msg">{{ message }}</p>
    <a href="/" class="btn btn-primary btn-lg">&larr; Back to Home</a>
  </div>
</div>
</body>
</html>
