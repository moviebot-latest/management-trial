{% extends 'auth_base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="lead">Use the username you created when you joined the library.</p>
<form method="post" action="{{ url_for('login') }}">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
  <label for="username">Username</label>
  <input class="input" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <label for="loginPassword">Password</label>
  <div class="input-wrap">
    <input class="input" id="loginPassword" name="password" type="password" autocomplete="current-password" required>
    <button class="reveal" type="button" aria-controls="loginPassword" aria-pressed="false" onclick="togglePass('loginPassword',this)">Show</button>
  </div>
  <button class="btn" type="submit">Sign in</button>
</form>
<div class="links">
  <a class="link" href="{{ url_for('forgot_password') }}">Forgot your password?</a>
  <span>New here? <a class="link" href="{{ url_for('register') }}">Create a member account</a></span>
</div>
{% endblock %}
{% block scripts %}<script>
function togglePass(id,b){var i=document.getElementById(id),show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'Hide':'Show';b.setAttribute('aria-pressed',show?'true':'false');}
</script>{% endblock %}
