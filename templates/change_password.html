<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Password | Library</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="auth-page"><main class="auth-wrap"><section class="auth-card"><div class="brand-icon">🔐</div><h1>Change <span>Password</span></h1><p class="auth-sub">Update your library account password.</p><form method="post"><input type="hidden" name="_csrf_token" value="{{csrf_token}}"><label>Current Password</label><div class="field"><input name="current_password" type="password" required></div><label>New Password</label><div class="field"><input id="newp" name="new_password" type="password" minlength="6" required></div><label>Confirm New Password</label><div class="field"><input id="newc" name="confirm_password" type="password" minlength="6" required></div><div id="m" class="match"></div><button class="primary">Update Password</button></form><div class="auth-footer"><a href="{{url_for('forgot_password')}}">📧 Forgot Password / Email OTP</a><br><a href="{{url_for('dashboard')}}">← Back to Library</a></div></section></main><script>const p=document.getElementById('newp'),c=document.getElementById('newc'),m=document.getElementById('m');function x(){if(!c.value)m.textContent='';else m.textContent=p.value===c.value?'✓ Passwords match':'✕ Passwords do not match';m.className=p.value===c.value&&c.value?'match ok':'match bad'}p.oninput=x;c.oninput=x</script></body></html>
