<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics | Library Management System</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><style>body{padding:24px}.wrap{max-width:1100px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.back{padding:11px 15px;border-radius:13px;background:#eeeaff;color:#5540c8;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:24px;border-radius:24px;background:rgba(255,255,255,.78);border:1px solid #e8e8f2;box-shadow:0 16px 45px rgba(50,40,100,.08)}.card span{font-size:28px}.card small{display:block;color:#737b8d;margin:8px 0}.card b{font-size:32px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start;gap:10px}.head h1{font-size:32px}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="head"><div><small>LIBRARY INSIGHTS</small><h1>Analytics</h1><p>Live database summary for administrators.</p></div><a class="back" href="{{url_for('dashboard')}}">← Dashboard</a></div><section class="grid"><div class="card"><span>👥</span><small>Total Members</small><b>{{total_members}}</b></div><div class="card"><span>📚</span><small>Total Books</small><b>{{total_books}}</b></div><div class="card"><span>↻</span><small>Active Issues</small><b>{{active_loans}}</b></div><div class="card"><span>⏰</span><small>Overdue</small><b>{{overdue}}</b></div><div class="card"><span>💳</span><small>Payment Records</small><b>{{paid}}</b></div><div class="card"><span>↩️</span><small>Refunded</small><b>{{refunded}}</b></div><div class="card"><span>₹</span><small>Payment/Refund Record Total</small><b>₹{{'%.2f'|format(revenue)}}</b></div></section></main></body></html>
