<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment — Library Management System</title><link rel="stylesheet" href="/static/style.css"><style>.pay-wrap{max-width:620px;margin:0 auto;padding:30px}.pay-card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:28px;box-shadow:0 12px 35px rgba(15,23,42,.08)}.amount{font-size:34px;font-weight:900;margin:8px 0 20px}.choice{display:flex;gap:12px;flex-wrap:wrap}.choice form{flex:1;min-width:210px}.choice button{width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;cursor:pointer}</style></head>
<body><div class="pay-wrap"><div class="pay-card"><p style="color:#64748b;margin:0">Library Management System</p><h1 style="margin:8px 0">Secure Payment</h1><p style="color:#64748b">Order #{{order.id}} · {{order.payment_gateway_order_id}}</p><div class="amount">₹{{'%.2f'|format(order.total_amount|float)}}</div><p style="color:#475569">Choose a payment result for the internship project. No real money is charged.</p><div class="choice" style="margin-top:22px"><form method="post" action="{{url_for('simulate_demo_payment')}}"><input type="hidden" name="_csrf_token" value="{{csrf_token}}"><input type="hidden" name="order_id" value="{{order.id}}"><input type="hidden" name="outcome" value="SUCCESS"><button type="submit" style="background:#111827;color:#fff">✓ Pay Now</button></form><form method="post" action="{{url_for('simulate_demo_payment')}}"><input type="hidden" name="_csrf_token" value="{{csrf_token}}"><input type="hidden" name="order_id" value="{{order.id}}"><input type="hidden" name="outcome" value="FAILED"><button type="submit" style="background:#fee2e2;color:#991b1b">Payment Failed</button></form></div><div style="margin-top:22px"><a class="btn btn-ghost" href="{{url_for('cart')}}">← Back to Cart</a></div></div></div></body></html>
